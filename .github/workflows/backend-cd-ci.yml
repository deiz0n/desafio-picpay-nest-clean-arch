name: Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: deiz0n/desafio-picpay-nest-clean-arch-picpay-challenge-api

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          npm run lint
          git diff --exit-code

      - name: Build application
        run: npm run build

  publish-and-deploy:
    name: Publish image and deploy
    needs: quality

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: picpay-backend-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-backend-deploy

      - name: Find healthy application instances
        id: instances
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_IDS="$(
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ vars.AWS_ASG_NAME }}" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`].InstanceId' \
              --output text
          )"

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "Nenhuma instância saudável encontrada no Auto Scaling Group."
            exit 1
          fi

          echo "Instâncias encontradas: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy backend through Systems Manager
        shell: bash
        env:
          INSTANCE_IDS: ${{ steps.instances.outputs.instance_ids }}
        run: |
          set -euo pipefail

          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "cd /opt/picpay-app",
             "docker compose -f /opt/picpay-app/compose.yaml pull backend",
              "docker compose -f /opt/picpay-app/compose.yaml up -d --no-deps --force-recreate backend",
              "for attempt in $(seq 1 30); do if curl -fsS http://127.0.0.1/api/v1.0/health; then docker image prune -f; exit 0; fi; sleep 5; done",
              "docker compose -f /opt/picpay-app/compose.yaml logs --tail=100 backend",
              "exit 1"
            ]
          }
          JSON

          COMMAND_ID="$(
            aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy backend ${GITHUB_SHA}" \
              --instance-ids $INSTANCE_IDS \
              --parameters file://ssm-parameters.json \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "Comando SSM enviado: $COMMAND_ID"

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Aguardando deploy em $INSTANCE_ID..."

            if ! aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json || true

              exit 1
            fi

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{
                Status: Status,
                Output: StandardOutputContent,
                Error: StandardErrorContent
              }' \
              --output json
          done

      - name: Validate public health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-delay 5 \
            https://dudupay-picpay-challenge.dev.br/api/v1.0/health
